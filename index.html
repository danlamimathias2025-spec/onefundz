    <meta property="og:title" content="Dangote Refinery IPO | Official Share Allocation & Trading Portal" />

  <body class="bg-slate-950 text-white selection:bg-amber-500/30 selection:text-amber-400">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Cache-Buster & Clean Cache Protocol -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (let reg of regs) {
            reg.unregister().then(() => console.log('[PWA] Unregistered stale worker'));
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
  </body>
</html>
