    <!-- Cache-Buster & Clean Cache Protocol -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (let reg of regs) {
            reg.unregister().then(() => console.log('[PWA] Unregistered stale worker'));
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name).then(() => console.log('[Cache] Cleared stale cache:', name));
          }
        });
      }
      try {
        localStorage.removeItem('readNotifications');
      } catch(e) {}
    </script>
  </body>
