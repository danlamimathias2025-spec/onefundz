<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dangote Refinery IPO | Official Share Allocation & Trading Portal</title>
    <meta name="description" content="Official Dangote Petroleum Refinery IPO Share Allocation & Investor Trading Portal. Buy, manage, and resell shares directly." />
    <meta property="og:title" content="Dangote Refinery IPO | Official Share Allocation & Trading Portal" />
    <meta property="og:description" content="Official Dangote Petroleum Refinery IPO Share Allocation & Investor Trading Portal. Buy, manage, and resell shares directly." />
    
    <!-- PWA primary configs -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a1931" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <!-- iOS support meta marks -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dangote Refinery IPO" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="bg-slate-950 text-white selection:bg-amber-500/30 selection:text-amber-400">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[PWA Service Worker] Registered successfully with scope:', reg.scope);
            })
            .catch((err) => {
              console.error('[PWA Service Worker] Registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
