<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Emerald Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  <rect x="28" y="28" width="456" height="456" rx="86" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2" stroke-dasharray="10,6"/>

  <!-- Shield Crest Background -->
  <path d="M256 70 L390 120 V250 C390 345 325 415 256 440 C187 415 122 345 122 250 V120 L256 70 Z" 
        fill="url(#emeraldGrad)" 
        fill-opacity="0.12" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Shield Inner Layer -->
  <path d="M256 92 L370 135 V245 C370 328 312 392 256 415 C200 392 142 328 142 245 V135 L256 92 Z" 
        fill="url(#bgGrad)" 
        stroke="url(#emeraldGrad)" 
        stroke-width="4"/>

  <!-- Stylized Number "1" Growth Pillar -->
  <path d="M210 320 V195 L180 215 V180 L225 145 H252 V320 H210 Z" fill="url(#goldGrad)"/>

  <!-- Stylized "F" Top Crossbar & Emerald Arrow Wings -->
  <path d="M252 160 H335 V195 H252 V160 Z" fill="url(#goldGrad)"/>
  <path d="M252 220 H315 V252 H252 V220 Z" fill="url(#emeraldGrad)"/>

  <!-- Dynamic Profit Growth Arrow Header -->
  <path d="M305 320 L355 240 L385 265 L335 345 H305 Z" fill="url(#emeraldGrad)"/>

  <!-- Center Sparkle / Diamond Crest -->
  <polygon points="256,230 264,248 282,256 264,264 256,282 248,264 230,256 248,248" fill="#FFFFFF"/>

  <!-- Bottom Brand Ribbon Banner -->
  <path d="M110 380 L402 380 L385 418 L402 450 L110 450 L127 418 Z" fill="url(#ribbonGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <text x="256" y="420" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ONEFUNDZ</text>
  <text x="256" y="442" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#FBBF24" text-anchor="middle" letter-spacing="4">WEALTH COOPERATIVE</text>
</svg>
